version: '3.8'

services:
  fwc-vog-timing:
    build: .
    container_name: ${CONTAINER_NAME:-fwc-vog-timing}
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - INSTANCE_NAME=${INSTANCE_NAME:-FWC VoG Timing System}
      - INSTANCE_COLOR=${INSTANCE_COLOR:-#F8FF00}
    restart: unless-stopped